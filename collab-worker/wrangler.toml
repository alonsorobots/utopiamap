name = "utopiamap-relay"
# Renamed from "utopiamap-collab" on 2026-05-15 after a cursor-spam
# bug burned through 11.6M Durable Object requests in two hours,
# tripping Cloudflare's account-level throttle. The throttle is
# account-wide and didn't auto-clear when we upgraded to Workers
# Paid (a known Cloudflare bug, github.com/cloudflare/workers-sdk
# #9909). The new script name doesn't escape it -- both names land
# on the same account quota -- but we keep the new name to mark a
# clean break from the buggy era, and so we have a tidy script to
# point support at when the throttle ever lifts. The old
# "utopiamap-collab" script can be deleted from the dashboard once
# the account quota is healthy again.
main = "src/worker.ts"
compatibility_date = "2024-12-01"
# Keep the *.workers.dev URL alive as a fallback so we can smoke-test
# the relay even if the custom domain ever has DNS / cert trouble.
workers_dev = true

# Bind collab.utopiamap.com directly to this Worker. Cloudflare
# auto-provisions the DNS record + cert; the frontend already points
# VITE_COLLAB_URL at wss://collab.utopiamap.com/room/.
[[routes]]
pattern = "collab.utopiamap.com"
custom_domain = true

# Durable Object that holds an in-memory list of WebSockets for one room and
# relays Yjs sync + awareness messages between them. State lives only as long
# as at least one client is connected; nothing is persisted to disk.
[[durable_objects.bindings]]
name = "ROOMS"
class_name = "RoomDO"

[[migrations]]
tag = "v1"
# SQLite-backed DOs are required on Workers Free and supported on
# Workers Paid. We never call state.storage so the per-DO SQLite DB
# is always empty.
new_sqlite_classes = ["RoomDO"]
